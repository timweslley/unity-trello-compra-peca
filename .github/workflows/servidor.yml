# Servidor próprio (pasta servidor/): testa a cada push e publica no Cloud Run quando as variáveis do
# repositório estiverem preenchidas (Settings > Secrets and variables > Actions > Variables):
#   GCP_PROJETO       id do projeto no Google Cloud (ex.: unity-compra-peca)
#   GCP_WIF_PROVIDER  projects/NNN/locations/global/workloadIdentityPools/github/providers/github
#   GCP_SA_EMAIL      conta de serviço que publica (ex.: publicador@unity-compra-peca.iam.gserviceaccount.com)
# Sem elas, só roda os testes (não falha).
name: Servidor
on:
  push:
    branches: [main]
    paths: ['servidor/**', '.github/workflows/servidor.yml']
  workflow_dispatch:
concurrency: servidor
defaults:
  run:
    working-directory: servidor
jobs:
  testar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: servidor/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test
  publicar:
    needs: testar
    if: ${{ vars.GCP_PROJETO != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Publicar no Cloud Run (São Paulo)
        run: |
          gcloud run deploy compra-peca \
            --source . \
            --project "${{ vars.GCP_PROJETO }}" \
            --region southamerica-east1 \
            --allow-unauthenticated \
            --min-instances 0 --max-instances 2 --memory 512Mi --cpu 1 \
            --set-env-vars "GIT_SHA=${GITHUB_SHA::7},TRELLO_QUADRO=${{ vars.TRELLO_QUADRO || 'ZX4gRmnX' }},MODO=${{ vars.MODO || 'OBSERVAR' }}" \
            --update-secrets "DATABASE_URL=DATABASE_URL:latest,TRELLO_KEY=TRELLO_KEY:latest,TRELLO_TOKEN=TRELLO_TOKEN:latest,TRELLO_SEGREDO=TRELLO_SEGREDO:latest,URL_PUBLICA=URL_PUBLICA:latest" \
            --quiet
