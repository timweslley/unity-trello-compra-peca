# Servidor próprio (pasta servidor/): testa a cada push e publica no Cloud Run (São Paulo).
# A publicação usa os valores do bloco `env` abaixo (não são segredos — dizem só ONDE publicar).
# Enquanto GCP_NUMERO estiver vazio, só roda os testes (não falha).
# O acesso ao Google é sem senha (Workload Identity Federation), preparado por servidor/infra/preparar-gcp.sh.
name: Servidor
on:
  push:
    branches: [main]
    paths: ['servidor/**', '.github/workflows/servidor.yml']
  workflow_dispatch:
concurrency: servidor
env:
  GCP_PROJETO: unity-compra-peca
  GCP_NUMERO: '858550421734'   # número do projeto unity-compra-peca
  REGIAO: southamerica-east1
  SERVICO: compra-peca
  TRELLO_QUADRO: ZX4gRmnX   # TESTE; o principal (oH4TbTqb) só na fase 5
  MODO: ATIVO               # ATIVO no TESTE (Weslley, 07/10); o principal segue bloqueado no código
defaults:
  run:
    working-directory: servidor
jobs:
  testar:
    runs-on: ubuntu-24.04
    outputs:
      publicar: ${{ steps.p.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: servidor/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - id: p
        run: echo "publicar=${{ env.GCP_NUMERO != '' }}" >> "$GITHUB_OUTPUT"
  publicar:
    needs: testar
    if: ${{ needs.testar.outputs.publicar == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.GCP_NUMERO }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: publicador@${{ env.GCP_PROJETO }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Montar e enviar a imagem
        run: |
          IMAGEM="${REGIAO}-docker.pkg.dev/${GCP_PROJETO}/servidor/compra-peca"
          echo "IMAGEM=$IMAGEM" >> "$GITHUB_ENV"
          gcloud auth configure-docker ${REGIAO}-docker.pkg.dev --quiet
          docker build -t "$IMAGEM:${GITHUB_SHA::7}" .
          docker push "$IMAGEM:${GITHUB_SHA::7}"
      - name: Publicar no Cloud Run
        run: |
          URL="https://${SERVICO}-${GCP_NUMERO}.${REGIAO}.run.app"
          gcloud run deploy "$SERVICO" \
            --image "$IMAGEM:${GITHUB_SHA::7}" \
            --project "$GCP_PROJETO" --region "$REGIAO" \
            --service-account "compra-peca-run@${GCP_PROJETO}.iam.gserviceaccount.com" \
            --no-invoker-iam-check \
            --min-instances 0 --max-instances 2 --memory 512Mi --cpu 1 --timeout 300 \
            --set-env-vars "GIT_SHA=${GITHUB_SHA::7},URL_PUBLICA=${URL},TRELLO_QUADRO=${TRELLO_QUADRO},MODO=${MODO}" \
            --update-secrets "DATABASE_URL=DATABASE_URL:latest,TRELLO_KEY=TRELLO_KEY:latest,TRELLO_TOKEN=TRELLO_TOKEN:latest,TRELLO_SEGREDO=TRELLO_SEGREDO:latest" \
            --quiet
      - name: Conferir /saude
        run: |
          URL="https://${SERVICO}-${GCP_NUMERO}.${REGIAO}.run.app"
          for i in 1 2 3 4 5; do
            if curl -fsS "$URL/saude"; then echo; exit 0; fi
            sleep 6
          done
          echo "::error::/saude não respondeu em $URL"; exit 1
