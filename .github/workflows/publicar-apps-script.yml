# Publica o Apps Script "Log de Descricao Trello" a cada mudança em apps-script/ na main.
# Sobe o código (clasp push), cria versão nova e atualiza a MESMA implantação do web app
# (o link do formulário não muda). Antes de sobrescrever, baixa o código atual do projeto
# como ponto de restauração (artefato "apps-script-antes-...") e aborta se o projeto tiver
# arquivos que não estão no repositório.
# Requer o segredo CLASPRC_JSON (conteúdo do .clasprc.json gerado por `clasp login`).
# PLANO B (GitHub Actions na fila/indisponível — aconteceu em 05/10/2026, 3 runs cancelados "not acquired by Runner"):
#   no PC, logado no clasp como sistema@: baixar o ZIP do repositório (main), extrair, abrir PowerShell na pasta e
#   npx.cmd @google/clasp@2.4.2 push -f
#   npx.cmd @google/clasp@2.4.2 deploy -i <DEPLOY_ID abaixo> -d "manual <commit>"
name: Publicar Apps Script
on:
  push:
    branches: [main]
    paths: ['apps-script/**', 'tools/**']
  workflow_dispatch:
  schedule:
    - cron: '20 11 * * 1'   # segunda 08:20 (Brasília): só confere se o login do clasp ainda vale (o GitHub avisa por e-mail se falhar)
concurrency: apps-script
env:
  DEPLOY_ID: AKfycbwkTI6PgPTe8OgIcyxzk5oysMvK2BvWwIQEdh5vhOY2n44KlVJvmeHdXTU1HQ3I5BoQew
  # Mensagem única para quando o login da conta sistema@ cair (token revogado, senha trocada, 6 meses sem uso)
  AVISO_LOGIN: "O login do clasp (segredo CLASPRC_JSON) expirou ou foi revogado — nada foi publicado. Refazer no PC, logado no Google como sistema@unitycs.com.br: PowerShell > npx.cmd @google/clasp@2.4.2 login > abrir %USERPROFILE%\\.clasprc.json e colar o conteúdo em GitHub > Settings > Secrets and variables > Actions > CLASPRC_JSON. Depois rodar este workflow de novo (Run workflow)."
jobs:
  # Toda segunda (e no botão Run workflow): confere o login sem publicar nada. Falhou = e-mail do GitHub com o passo a passo.
  conferir-login:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i -g @google/clasp@2.4.2
      - name: Login do clasp ainda vale?
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC" ]; then echo "::error::Falta o segredo CLASPRC_JSON no repositório"; exit 1; fi
          printf '%s' "$CLASPRC" > ~/.clasprc.json
          printf '{"scriptId":"1sV_VMM5fUPxBmaExaWHAYdaw4Xda9-ebtKr2BD2iwabG4hxLodE50W6c"}' > .clasp.json
          if clasp deployments > /tmp/dep 2>&1; then echo "Login OK — $(grep -c AKfy /tmp/dep) implantação(ões) visível(is)."; else cat /tmp/dep; echo "::error::$AVISO_LOGIN"; exit 1; fi
  publicar:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04   # 05/10/2026: ubuntu-latest ficou 15 min na fila e foi cancelado ("not acquired by Runner"); pool fixo
    steps:
      - uses: actions/checkout@v4
      - name: Formulário estático em dia
        run: python3 tools/gerar_formulario_estatico.py --conferir
      - name: Sintaxe do código (um erro derruba o projeto inteiro)
        run: |
          set -e
          for f in apps-script/*.gs; do cp "$f" /tmp/chk.js; node --check /tmp/chk.js || { echo "::error file=$f::erro de sintaxe"; exit 1; }; done
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar clasp
        run: npm i -g @google/clasp@2.4.2
      - name: Credencial
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC" ]; then echo "::error::Falta o segredo CLASPRC_JSON no repositório"; exit 1; fi
          printf '%s' "$CLASPRC" > ~/.clasprc.json
          # confere o login ANTES de mexer em qualquer coisa: se caiu, para aqui com o passo a passo (nada é publicado pela metade)
          if ! clasp deployments > /tmp/dep 2>&1; then cat /tmp/dep; echo "::error::$AVISO_LOGIN"; exit 1; fi
          echo "Login OK — $(grep -c AKfy /tmp/dep) implantação(ões) visível(is)."
      - name: Baixar o código atual (ponto de restauração)
        run: |
          SID=$(python3 -c "import json;print(json.load(open('.clasp.json'))['scriptId'])")
          mkdir -p /tmp/atual && cd /tmp/atual
          printf '{"scriptId":"%s","fileExtension":"gs"}' "$SID" > .clasp.json
          clasp pull
          echo "No Apps Script hoje:"; ls -1 /tmp/atual
          falta=0
          for f in /tmp/atual/*; do
            n=$(basename "$f")
            if [ ! -f "$GITHUB_WORKSPACE/apps-script/$n" ]; then echo "::error::O projeto tem o arquivo '$n' que não está no repositório — publicar apagaria. Abortado."; falta=1; fi
          done
          exit $falta
      - uses: actions/upload-artifact@v4
        with:
          name: apps-script-antes-${{ github.sha }}
          path: /tmp/atual
          retention-days: 90
      - name: Subir código
        run: clasp push -f
      # 05/10/2026: o web app passou a rodar na conta sistema@unitycs.com.br (cota de UrlFetch é por conta).
      # Publicar a versão com o login do Weslley faria o formulário voltar a rodar na conta dele, então a nova
      # versão só é publicada quando o segredo CLASPRC_JSON for o login da conta sistema@ (DEPLOY_PELA_CI=sim).
      # Desde 05/10 14:15 é assim: CLASPRC_JSON = `clasp login` feito como sistema@ e DEPLOY_PELA_CI=sim (versão 101
      # foi a 1ª pela CI). A conta sistema@ precisa da "Google Apps Script API" ativada em script.google.com/home/usersettings.
      # Se o login expirar/for revogado: no PC, `npx.cmd @google/clasp@2.4.2 login` logado como sistema@ e colar
      # o %USERPROFILE%\.clasprc.json no segredo.
      - name: Nova versão na implantação do formulário
        if: ${{ vars.DEPLOY_PELA_CI == 'sim' }}
        run: |
          d="git $(git rev-parse --short HEAD): $(git log -1 --format=%s | cut -c1-80)"
          if ! out=$(clasp deploy -i "$DEPLOY_ID" -d "$d" 2>&1); then
            echo "$out"
            echo "::error::clasp deploy falhou: $(echo "$out" | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          echo "$out"
          clasp deployments
      - name: Aviso
        if: ${{ vars.DEPLOY_PELA_CI != 'sim' }}
        run: echo "::warning::Código publicado (acionadores já usam). O web app (formulário) só recebe a versão nova quando a conta sistema@ republicar em Implantar > Gerenciar implantações, ou quando DEPLOY_PELA_CI=sim com o login dela."

