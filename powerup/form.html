<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedido de Peça Unity</title>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script src="./config.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #f4f5f7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #172b4d; }
  #app { display: flex; flex-direction: column; height: 100%; }
  #barra { display: none; align-items: center; gap: 10px; padding: 6px 12px; background: #fff; border-bottom: 1px solid #dfe1e6; font-size: 13px; }
  #barra .sp { flex: 1; }
  #barra button, #tela button { border: 0; border-radius: 4px; padding: 7px 14px; font-size: 14px; cursor: pointer; }
  #barra button { background: #eb5a46; color: #fff; }
  #frame { flex: 1; width: 100%; border: 0; display: none; }
  #tela { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  #tela .cx { max-width: 420px; background: #fff; border-radius: 8px; padding: 28px 24px; box-shadow: 0 1px 4px rgba(9,30,66,.15); }
  #tela h2 { margin: 0 0 8px; font-size: 18px; }
  #tela p { margin: 0 0 18px; font-size: 14px; line-height: 1.45; color: #42526e; }
  #tela button { background: #0079bf; color: #fff; }
  #tela .erro { color: #b04632; font-size: 13px; margin-top: 12px; }
  #tela .oculto { display: none; }
  #concluido { display: none; }
  /* 19/10/2026: padrão 2.0 (só no quadro TESTE, classe v2f): cartão com ícone, botão azul arredondado e giro no carregando */
  html.v2f, .v2f body { background: #eef0f3; }
  .v2f body { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .v2f #tela .cx { max-width: 440px; border: 1px solid #dcdfe4; border-radius: 12px; box-shadow: 0 1px 2px rgba(9,30,66,.06); padding: 28px 24px 24px; }
  .v2f #tela h2 { font-size: 20px; line-height: 26px; font-weight: 700; color: #172b4d; }
  .v2f #tela p { font-size: 15px; line-height: 22px; color: #44546f; }
  .v2f #tela button { font-family: inherit; background: #0c66e4; border-radius: 8px; min-height: 40px; padding: 8px 18px; font-size: 15px; font-weight: 600; }
  .v2f #tela button:hover { background: #0055cc; }
  .v2f #tela button:focus-visible { outline: none; box-shadow: 0 0 0 2px #fff, 0 0 0 4px #0c66e4; }
  .v2f #tela .erro { background: #ffeceb; color: #5d1f1a; border-radius: 8px; padding: 10px 12px; font-size: 14px; line-height: 20px; text-align: left; }
  .v2f #tIco { width: 44px; height: 44px; border-radius: 50%; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; background: #e9f2ff; color: #0c66e4; }
  .v2f #tIco svg { width: 24px; height: 24px; }
  .v2f #tIco.gira { background: none; border: 3px solid #dcdfe4; border-top-color: #0c66e4; width: 36px; height: 36px; box-sizing: border-box; animation: v2fgira .8s linear infinite; }
  @keyframes v2fgira { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .v2f #tIco.gira { animation: none; } }
  .v2f #tIco.alerta { background: #ffeceb; color: #c9372c; }
</style>
</head>
<body>
<div id="app">
  <div id="barra">
    <span id="titulo">Pedido de Peça — Unity</span>
    <span class="sp"></span>
    <span id="concluido">✅ Concluído — pode fechar.</span>
    <button onclick="fechar()">Fechar</button>
  </div>
  <div id="tela">
    <div class="cx" role="status" aria-live="polite">
      <div id="tIco" aria-hidden="true" hidden></div>
      <h2 id="tTitulo">Carregando…</h2>
      <p id="tTexto">Um instante.</p>
      <button id="btnEntrar" class="oculto" onclick="entrar()">Entrar com o Trello</button>
      <div id="tErro" class="erro oculto" role="alert"></div>
    </div>
  </div>
  <iframe id="frame" allow="clipboard-write" title="Formulário"></iframe>
</div>
<script>
var cfg = window.PU_CFG;
var t = TrelloPowerUp.iframe({ appKey: cfg.CHAVE, appName: cfg.NOME });
var api = t.getRestApi();
var CARD = t.arg('card') || '', MODO = t.arg('modo') || '';
/* o Trello pode reaproveitar o iframe trocando só o "#contexto" (sem recarregar): hash novo = card/args novos (07/10/2026) */
window.addEventListener('hashchange', function () { location.reload(); });

function $(id) { return document.getElementById(id); }
/* 19/10/2026: visual 2.0 desta janela só no quadro TESTE (id longo do ZX4gRmnX) */
var V2F = (function () { try { return (t.getContext() || {}).board === '6ab56213225639419520b700' || cfg.SECAO_V2 === 'todos'; } catch (e) { return false; } })();
if (V2F) document.documentElement.classList.add('v2f');
var ICF = { alerta: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>', lock: '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>' };
function icoTela(titulo, mostrarBotao) {
  var el = $('tIco'); if (!V2F || !el) return;
  el.hidden = false;
  if (/Carregando|Entrando/.test(titulo)) { el.className = 'gira'; el.innerHTML = ''; }
  else { var al = /Não foi possível/.test(titulo); el.className = al ? 'alerta' : ''; el.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (al ? ICF.alerta : ICF.lock) + '</svg>'; }
}
if (V2F) { $('tTitulo').textContent = 'Abrindo o pedido…'; $('tTexto').textContent = 'Um instante.'; icoTela('Carregando'); }
function tela(titulo, texto, mostrarBotao, erro) {
  // mesmo título e texto do login do formulário 2.0
  if (V2F && titulo === 'Precisamos do seu login do Trello') { titulo = 'Entre com o Trello'; texto = 'Para fazer ou alterar um pedido, entre com a sua conta do Trello. O card fica no seu nome (só na primeira vez).'; }
  icoTela(titulo, mostrarBotao);
  $('tTitulo').textContent = titulo; $('tTexto').textContent = texto;
  $('btnEntrar').classList.toggle('oculto', !mostrarBotao);
  $('tErro').textContent = erro || ''; $('tErro').classList.toggle('oculto', !erro);
}
function fechar() { t.closeModal(); }

var SERVIDOR = false, V2 = false;
function carregar(token) {
  /* 07/10/2026: o popup abriu com o card errado (BAE2475 mostrou FKI2J50) — se o argumento `card` não vier, busca o card
   * do contexto do Trello em vez de deixar o formulário cair no "card pendente" do navegador */
  var pegarCard = (!CARD && MODO !== 'novo') ? t.card('shortLink').then(function (c) { CARD = (c && c.shortLink) || ''; }).catch(function () {}) : Promise.resolve();
  /* tema "trello" em avaliação: só para os usuários listados em PU_CFG.TEMA_TRELLO_USUARIOS; os demais ficam no visual padrão */
  /* 07/10/2026: quadro listado em QUADROS_SERVIDOR (o TESTE) usa o servidor próprio: o formulário recebe srv=1 */
  var pegarQuadro = t.board('shortLink').then(function (b) { var sl = (b && b.shortLink) || ''; SERVIDOR = (cfg.QUADROS_SERVIDOR || []).indexOf(sl) >= 0; V2 = SERVIDOR || (cfg.QUADROS_V2 || []).indexOf(sl) >= 0; }).catch(function () {});
  return Promise.all([pegarCard, pegarQuadro]).then(function () { return t.member('username').catch(function () { return null; }); }).then(function (m) {
    var tema = !!(m && (cfg.TEMA_TRELLO_USUARIOS || []).indexOf(String(m.username || '').toLowerCase()) >= 0);
    carregar2(token, tema);
  });
}
function carregar2(token, tema) {
  // &v= muda a cada minuto: o GitHub Pages manda cache de 10 min e o Trello reabria o formulário velho logo depois de publicar (09/10/2026)
  var url = (cfg.URL_FORM || cfg.URL_APP) + '?pu=1&v=' + Math.floor(Date.now() / 60000) + (tema ? '&tema=trello' : '&tema=padrao') + (SERVIDOR ? '&srv=1' : V2 ? '&v2=1' : '');   // 16/10/2026: v2=1 = visual 2.0 com o Apps Script (virada do principal)
  if (MODO === 'novo') url += '&novo=1';
  else if (CARD) url += '&card=' + encodeURIComponent(CARD) + (MODO ? '&modo=' + encodeURIComponent(MODO) : '');
  url += '#token=' + token;
  $('titulo').textContent = ({ compras: 'Cotação / Compra / Recebimento', cot: 'Cotação', aut: 'Autorização', compra: 'Compra', rec: 'Recebimento', forn: 'Fornecimento', novo: 'Novo pedido de peça' })[MODO] ? ({ compras: 'Cotação / Compra / Recebimento', cot: 'Cotação', aut: 'Autorização', compra: 'Compra', rec: 'Recebimento', forn: 'Fornecimento', novo: 'Novo pedido de peça' })[MODO] + ' — Unity' : 'Editar/Incluir peça — Unity';
  $('tela').style.display = 'none';
  $('barra').style.display = (tema || SERVIDOR || V2) ? 'none' : 'flex';   // no tema novo (e no TESTE, 2.0) o próprio formulário tem o Fechar
  $('frame').style.display = 'block';
  $('frame').src = url;
}

function entrar() {
  tela('Entrando…', 'Autorize o acesso na janela do Trello que vai abrir.', false);
  api.authorize({ scope: 'read,write', expiration: 'never' })
    .then(function () { return api.getToken(); })
    .then(carregar)
    .catch(function (e) {
      tela('Precisamos do seu login do Trello', 'O formulário cria e altera os cards no seu nome. Clique para autorizar (uma vez só).', true,
        'Não deu certo: ' + ((e && e.message) || e) + '. Se o navegador bloqueou a janela, libere pop-ups para trello.com e tente de novo.');
    });
}

function iniciar() {
  api.isAuthorized().then(function (ok) {
    if (!ok) return tela('Precisamos do seu login do Trello', 'O formulário cria e altera os cards no seu nome. Clique para autorizar (uma vez só).', true);
    return api.getToken().then(carregar);
  }).catch(function (e) {
    tela('Não foi possível iniciar', String((e && e.message) || e), true);
  });
}

/* O formulário (dentro do iframe do Apps Script) avisa quando terminou ou quando o login expirou. */
window.addEventListener('message', function (ev) {
  var d = ev.data || {};
  if (d.vd === 'concluido') {
    $('concluido').style.display = 'inline';
    t.set('card', 'shared', 'vd_atualizado', Date.now()).catch(function () {});
  } else if (d.vd === 'login') {
    api.clearToken().catch(function () {}).then(function () {
      $('frame').style.display = 'none'; $('barra').style.display = 'none'; $('tela').style.display = 'flex';
      tela('Seu acesso ao Trello expirou', 'Entre de novo para continuar.', true);
    });
  } else if (d.vd === 'fechar') {
    fechar();
  }
});

iniciar();
</script>
</body>
</html>
