<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pedido de Peça Unity — conector do Power-Up</title>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script src="./config.js"></script>
</head>
<body>
<script>
/* Conector do Power-Up. O Trello carrega esta página escondida e pergunta
 * quais botões/badges/seções mostrar. Cada ação abre o formulário num popup (t.modal). */
(function () {
  var cfg = window.PU_CFG;
  var base = location.href.replace(/[^\/]*$/, '');   // pasta powerup/
  var ICONE = {
    editar: base + 'icone-editar.svg',
    compra: base + 'icone-compra.svg',
    novo:   base + 'icone-novo.svg',
    app:    base + 'icone-app.svg',
    secao:  base + 'icone-secao.svg'
  };

  function ehCardFixo(nome) {
    return /^\s*AVISO\b/i.test(nome || '') || /NOVO PEDIDO DE PE[ÇC]A/i.test(nome || '');
  }

  function abrir(t, modo, titulo) {
    return t.card('shortLink').then(function (c) {
      return t.modal({
        url: base + 'form.html',
        args: { card: c.shortLink, modo: modo },
        fullscreen: true,
        title: titulo
      });
    });
  }

  function abrirNovo(t) {
    return t.modal({
      url: base + 'form.html',
      args: { card: '', modo: 'novo' },
      fullscreen: true,
      title: '➕ Novo pedido de peça'
    });
  }

  /* uma ação por tarefa — o mesmo formulário, aberto direto na aba da tarefa */
  var TAREFAS = [
    { modo: '',       texto: '✏️ Editar/Incluir peça', icone: ICONE.editar, cor: 'orange' },
    { modo: 'cot',    texto: '💰 Cotação',             icone: ICONE.compra, cor: 'blue' },
    { modo: 'aut',    texto: '✅ Autorizar',           icone: ICONE.compra, cor: 'green' },
    { modo: 'compra', texto: '🛒 Compra',              icone: ICONE.compra, cor: 'purple' },
    { modo: 'rec',    texto: '📦 Recebimento',         icone: ICONE.compra, cor: 'sky' }
  ];
  function acao(tarefa) { return function (t) { return abrir(t, tarefa.modo, tarefa.texto); }; }
  /* tarefa que a coluna está esperando (vira o chip em destaque no card) */
  function tarefaDaColuna(nomeLista) {
    var L = String(nomeLista || '').toUpperCase();
    if (/EM COTA|FALTA DADOS/.test(L)) return /FALTA DADOS/.test(L) ? '' : 'cot';
    if (/PENDENTE AUTORIZAR|COTA[ÇC][ÃA]O FINALIZADA/.test(L)) return 'aut';
    if (/^AUTORIZADO/.test(L)) return 'compra';
    if (/FALTA CHEGAR/.test(L)) return 'rec';
    return null;
  }

  TrelloPowerUp.initialize({
    // menu "Power-ups" do rodapé do card: um botão por tarefa
    'card-buttons': function (t) {
      return t.card('name').then(function (c) {
        if (ehCardFixo(c.name)) {
          return [{ icon: ICONE.novo, text: 'Novo pedido', callback: abrirNovo }];
        }
        return TAREFAS.map(function (x) { return { icon: x.icone, text: x.texto, callback: acao(x) }; });
      });
    },
    // chips logo abaixo do título: Editar/Incluir peça + a tarefa da coluna atual
    'card-detail-badges': function (t) {
      return Promise.all([t.card('name'), t.list('name').catch(function () { return null; })]).then(function (r) {
        var c = r[0], lista = r[1];
        if (ehCardFixo(c.name)) {
          return [{ title: 'Unity', text: '➕ Novo pedido', color: 'orange', callback: abrirNovo }];
        }
        var m = tarefaDaColuna(lista && lista.name);
        var out = [{ title: 'Peças', text: TAREFAS[0].texto, color: 'orange', callback: acao(TAREFAS[0]) }];
        TAREFAS.forEach(function (x) { if (x.modo && x.modo === m) out.push({ title: 'Próxima tarefa', text: x.texto, color: x.cor, callback: acao(x) }); });
        if (m === null || m === '') out.push({ title: 'Compras', text: '💰 Cotação/Compra/Recebimento', color: 'green', callback: function (t) { return abrir(t, 'compras', '💰 Cotação/Compra/Recebimento'); } });
        return out;
      });
    },
    // seção própria no corpo do card (botões grandes + resumo)
    'card-back-section': function (t) {
      return {
        title: 'Pedido de Peça Unity',
        icon: ICONE.secao,
        content: {
          type: 'iframe',
          url: t.signUrl(base + 'secao.html'),
          height: 110
        }
      };
    },
    // botão no topo do quadro
    'board-buttons': function (t) {
      return [{ icon: { dark: ICONE.novo, light: ICONE.novo }, text: 'Novo pedido', callback: abrirNovo }];
    }
  }, { appKey: cfg.CHAVE, appName: cfg.NOME });
})();
</script>
</body>
</html>
