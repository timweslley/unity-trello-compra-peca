<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pedido de Peça Unity — conector do Power-Up</title>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script src="./config.js"></script>
</head>
<body>
<script>
/* Conector do Power-Up. O Trello carrega esta página escondida e pergunta
 * quais botões/badges/seções mostrar. Cada ação abre o formulário num popup (t.modal). */
(function () {
  var cfg = window.PU_CFG;
  var base = location.href.replace(/[^\/]*$/, '');   // pasta powerup/
  var ICONE = {
    editar: base + 'icone-editar.svg',
    compra: base + 'icone-compra.svg',
    novo:   base + 'icone-novo.svg',
    app:    base + 'icone-app.svg'
  };

  function ehCardFixo(nome) {
    return /^\s*AVISO\b/i.test(nome || '') || /NOVO PEDIDO DE PE[ÇC]A/i.test(nome || '');
  }

  function abrir(t, modo, titulo) {
    return t.card('shortLink').then(function (c) {
      return t.modal({
        url: base + 'form.html',
        args: { card: c.shortLink, modo: modo },
        fullscreen: true,
        title: titulo
      });
    });
  }

  function abrirNovo(t) {
    return t.modal({
      url: base + 'form.html',
      args: { card: '', modo: 'novo' },
      fullscreen: true,
      title: '➕ Novo pedido de peça'
    });
  }

  function editar(t) { return abrir(t, '', '✏️ Editar peças'); }
  function compras(t) { return abrir(t, 'compras', '💰 Cotação / Compra'); }

  TrelloPowerUp.initialize({
    // menu "Power-ups" do rodapé do card
    'card-buttons': function (t) {
      return t.card('name').then(function (c) {
        if (ehCardFixo(c.name)) {
          return [{ icon: ICONE.novo, text: 'Novo pedido', callback: abrirNovo }];
        }
        return [
          { icon: ICONE.editar, text: 'Editar peças', callback: editar },
          { icon: ICONE.compra, text: 'Cotação / Compra', callback: compras }
        ];
      });
    },
    // chips clicáveis logo abaixo do título do card
    'card-detail-badges': function (t) {
      return t.card('name').then(function (c) {
        if (ehCardFixo(c.name)) {
          return [{ title: 'Unity', text: '➕ Novo pedido', color: 'orange', callback: abrirNovo }];
        }
        return [
          { title: 'Unity', text: '✏️ Editar peças', color: 'orange', callback: editar },
          { title: 'Unity', text: '💰 Cotação / Compra', color: 'orange', callback: compras }
        ];
      });
    },
    // seção própria no corpo do card (botões grandes + resumo)
    'card-back-section': function (t) {
      return {
        title: 'Pedido de Peça Unity',
        icon: ICONE.app,
        content: {
          type: 'iframe',
          url: t.signUrl(base + 'secao.html'),
          height: 110
        }
      };
    },
    // botão no topo do quadro
    'board-buttons': function (t) {
      return [{ icon: { dark: ICONE.novo, light: ICONE.novo }, text: 'Novo pedido', callback: abrirNovo }];
    }
  }, { appKey: cfg.CHAVE, appName: cfg.NOME });
})();
</script>
</body>
</html>
